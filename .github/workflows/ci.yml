name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Unit tests (manifest)
        run: npm run test:unit

      - name: Package VSIX
        run: |
          set -euo pipefail
          npm run compile
          VER=$(node -p "require('./package.json').version")
          # @vscode/vsce (not the deprecated `vsce`); @types/vscode must stay <= engines.vscode.
          npx --yes @vscode/vsce package --no-dependencies --no-git-tag-version \
            --out "pyne-vscode-${VER}.vsix"
          ls -lh "pyne-vscode-${VER}.vsix"

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: pyne-vscode-vsix
          path: pyne-vscode-*.vsix
          if-no-files-found: error
          retention-days: 7
